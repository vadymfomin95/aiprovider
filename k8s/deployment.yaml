apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiprovider
  namespace: aiprovider
  labels:
    app: aiprovider
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiprovider
  template:
    metadata:
      labels:
        app: aiprovider
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: aiprovider
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
